# CI-reachability configuration (#lzcheckcireachguard), read by check-ci-reach.sh.
#
# workflow:  a workflow whose run: steps count as CI reach. Listing one here is a
#            claim that it runs on every push/PR — a tag-triggered release
#            workflow must not be listed, because reaching a gate only when you
#            cut a release is not reaching it. That is why
#            .github/workflows/release.yml is absent below.
# excuse:    a `make check` target that CI deliberately does not run, and why.
#
# The excuse list is the point of this file. It is the one place a reader can see
# what this binding does not enforce in CI, in the same spirit as KNOWN_UNCOVERED.
# Excuses are verified in both directions: an excuse for a target CI turns out to
# reach is a hard failure, so this list cannot rot into things that used to be
# true.

workflow: .github/workflows/ci.yml

# No excuses. Every gate `make check` runs is reached by the CI workflow above,
# which is a claim the guard re-proves on every run rather than a note.
