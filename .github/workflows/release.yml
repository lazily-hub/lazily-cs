name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (without a leading v)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  nuget:
    name: Pack and publish NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid package version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build all target frameworks
        run: >
          dotnet build
          --configuration Release
          --no-restore
          --nologo
          -warnaserror
          -p:Version=${{ steps.version.outputs.value }}

      - name: Fetch canonical lazily-spec conformance fixtures
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      - name: Guard — canonical fixtures present
        run: test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing"; exit 1; }

      - name: Test
        run: dotnet test --configuration Release --no-build --nologo

      - name: Pack
        run: >
          dotnet pack src/Lazily/Lazily.csproj
          --configuration Release
          --no-build
          --nologo
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Verify package and assembly versions
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          PACKAGE_PATH: artifacts/Lazily.${{ steps.version.outputs.value }}.nupkg
        run: ./scripts/check-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lazily-${{ steps.version.outputs.value }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Log in to NuGet
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: btak

      - name: Publish to NuGet
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
