name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: restore
        run: dotnet restore

      - name: build
        run: dotnet build --no-restore --nologo -warnaserror

      # The conformance runners resolve fixtures through the sibling-relative path
      # ../lazily-spec/conformance. Fixtures are never vendored into this repo —
      # a bundled copy drifts from the spec.
      - name: Fetch canonical lazily-spec conformance fixtures
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      # Assert the fixtures are actually present BEFORE running the suite. The runner
      # fails hard when the corpus is absent rather than skipping, but checking here
      # turns a confusing assertion failure into an explicit annotation.
      - name: Guard — canonical fixtures present
        run: |
          test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing"; exit 1; }
          for corpus in reactive-graph; do
            test -d "../lazily-spec/conformance/$corpus" || { echo "::error::../lazily-spec/conformance/$corpus missing"; exit 1; }
          done

      # The runtime evidence file the fixture-coverage guard and the scenario replay
      # ledger both read (#lzguardsnotinci). Set up here exactly as the Makefile's
      # `test` target does locally, and for the same two reasons:
      #
      #   * ABSOLUTE path. The recorder runs inside the dotnet test host, whose working
      #     directory is the test project's output dir, not the repo root — a relative
      #     path writes the manifest somewhere nothing reads.
      #   * TRUNCATED first. A guard that reads an evidence file from an earlier run is
      #     not measuring this run. On a fresh runner the file does not exist yet, but
      #     the truncation is the invariant, not the checkout's freshness.
      #
      # LAZILY_CONFORMANCE_STRICT turns the coverage script's "corpus absent, skip"
      # branch into a failure. Here the corpus IS supposed to be present, so a skip
      # would be the vacuous green this whole ladder exists to reject.
      - name: Prepare conformance evidence manifest
        run: |
          mkdir -p build
          : > build/conformance-fixtures-loaded.txt
          echo "LAZILY_CONFORMANCE_MANIFEST=$GITHUB_WORKSPACE/build/conformance-fixtures-loaded.txt" >> "$GITHUB_ENV"
          echo "LAZILY_CONFORMANCE_STRICT=1" >> "$GITHUB_ENV"

      - name: test
        run: dotnet test --no-build --nologo --verbosity normal

      # Three gates `make check` runs that no CI job reached (#lzinteroppeerci).
      # The interop peer is the cross-binding wire-compatibility check — nine
      # bindings must agree on a byte layout — and it ran on a laptop and nowhere
      # else. The package and FFI scripts are the same category: a check that
      # only ever runs locally is a check that rots.
      - name: Package layout check (#lzinteroppeerci)
        run: ./scripts/check-package.sh

      - name: FFI surface check (#lzinteroppeerci)
        run: ./scripts/check-ffi.sh

      - name: Interop peer self-check (#lzinteroppeerci)
        run: dotnet run --project src/Lazily.InteropPeer/Lazily.InteropPeer.csproj --no-build -- --self-check

      # "Green" and "ran nothing" must not be indistinguishable. The conformance test
      # asserts a positive fixture and assertion count internally; this step asserts
      # from the outside that the conformance tests were actually selected and passed.
      - name: Conformance replay executed, zero skips
        run: |
          out=$(dotnet test --no-build --nologo --verbosity normal --filter "FullyQualifiedName~Conformance" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qE 'Passed:[[:space:]]*[1-9]' || { echo "::error::no conformance tests ran"; exit 1; }
          if echo "$out" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then
            echo "::error::a conformance test skipped — the corpus must always replay in CI"
            exit 1
          fi

      # Two of the four conformance guards execute INSIDE the test host and are already
      # enforced by the steps above: the unconsumed-assertion-key gate
      # (#lzassertunknownkeys) and the read-but-never-asserted gate
      # (#lzconsumednotasserted), both raised by FixtureAssertions.Verify(). The other
      # two only ever ran as a script step `make check` invokes locally, so CI enforced
      # half the ladder and silently skipped the rest (#lzguardsnotinci):
      #
      #   rung 1  every canonical fixture was OPENED by the suite (#portconformancecoverage)
      #   rung 4  every scenario inside an opened fixture was REPLAYED (#lzscenariocoverage)
      #
      # Both read the runtime manifest prepared above, so they must run AFTER the test
      # steps that write it.
      - name: Conformance coverage + scenario replay ledger
        run: |
          out=$(./scripts/check-conformance-coverage.sh 2>&1) || { echo "$out"; echo "::error::conformance coverage guard failed"; exit 1; }
          echo "$out"
          # The script's own exit code is not sufficient evidence. Both rungs have a
          # shape that reports OK while measuring nothing: rung 1 over an empty corpus
          # listing, rung 4 over a manifest with no OPENED lines ("0/0 scenarios across
          # 0 opened fixtures"). Assert positive counts from the outside, the same way
          # the replay step above refuses a zero-test pass.
          #
          # Here-strings, NOT pipes — `printf ... | grep -q` dies of SIGPIPE on a match
          # and reports failure under pipefail, inverting every check. That exact
          # inversion is documented in the coverage script itself.
          if grep -q '^SKIP:' <<< "$out"; then
            echo "::error::coverage guard skipped instead of running"
            exit 1
          fi
          grep -qE 'conformance coverage OK: [1-9][0-9]*/[0-9]+ canonical fixtures' <<< "$out" \
            || { echo "::error::fixture coverage guard reported no covered fixtures"; exit 1; }
          grep -qE 'scenario replay coverage OK: [1-9][0-9]*/[0-9]+ scenarios across [1-9][0-9]* opened fixtures' <<< "$out" \
            || { echo "::error::scenario replay ledger reported no replayed scenarios"; exit 1; }

      # The gate that keeps every step above honest (#lzcheckcireachguard). It
      # compares `make check`'s prerequisite closure against the run: bodies in
      # this file and fails on any target CI does not reach. Comments inside run:
      # bodies are stripped first — a naive grep for "make check" reported all
      # nine bindings as covered and every one of those hits was a comment.
      # scripts/ci-reach.conf deliberately does NOT list release.yml: a gate
      # reached only when you cut a tag is not reached.
      - name: CI-reachability guard (#lzcheckcireachguard)
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          grep -q "check-ci-reach: OK" <<< "$out" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet format --verify-no-changes
        run: dotnet format --verify-no-changes
